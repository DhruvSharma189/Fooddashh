spring.application.name=fooddash
spring.profiles.active=dev
server.port=${SERVER_PORT:8098}

# Cloudinary credentials come from environment variables (never commit real keys)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT: override with a unique 32+ character secret in every deployed environment
app.jwt.secret=${JWT_SECRET:FoodDash-local-development-signing-key-change-before-deploy-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-days=${JWT_REFRESH_DAYS:7}
app.bootstrap-admin.email=${FOODDASH_ADMIN_EMAIL:}
app.bootstrap-admin.password=${FOODDASH_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${FOODDASH_ADMIN_NAME:FoodDash Admin}



